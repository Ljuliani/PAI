<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alta de estudiante</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="form-container">
            <img src="Imagenes/banner.jpg" alt="Banner principal" class="banner">
            <h1>Alta de estudiante</h1>
            <hr>
            <p class="instruccion"><strong>Completá los datos para registrar al estudiante.</strong></p>
            <form id="formInscripcion">

                <!-- 🧍 Datos personales -->
                <h3>Datos personales</h3>

                <hr>

                <label for="dni">&#9679; DNI: (Documento Nacional de Identidad)</label>
                <input type="number" id="dni" name="dni" min="1" step="1" max="2147483647" placeholder="12345678" required>

                <label for="apellidosynombres">&#9679; Apellidos y Nombres:</label>
                <input type="text" id="apellidosynombres" name="apellidosynombres" maxlength="200" placeholder="Túpac Amaru, José Gabriel" required>

                <label for="fechaNac">&#9679; Fecha de nacimiento:</label>
                <input type="date" id="fechaNac" name="fechaNac" required>

                <!-- 📱 Contacto -->
                <h3>Contacto</h3>

                <hr>

                <label for="correo">&#9679; Correo electrónico:</label>
                <input type="email" id="correo" name="correo" maxlength="50" placeholder="estudiante@mail.com" required>

                <label for="domicilio">&#9679; Domicilio: (Calle - Número - Localidad - Partido)</label>
                <input type="text" id="domicilio" name="domicilio" maxlength="80" placeholder="Bartolomé Mitre 5035, Villa Ballester" required>

                <label for="telefono">&#9679; Número de teléfono:</label>
                <input type="tel" id="telefono" name="telefono" maxlength="20" placeholder="11-2345-6789" required>

                <!-- 🎓 Información Académica -->
                <h3>Información académica</h3>
                
                <hr>
                
                <label for="fechaEgre">&#9679; Fecha de egreso del nivel Secundario: (De corresponder)</label>
                <input type="date" id="fechaEgre" name="fechaEgre">

                <label for="tituloSec">&#9679; Título Secundario: (Nombre del título obtenido o a obtener)</label>
                <input type="text" id="tituloSec" name="tituloSec" maxlength="50" placeholder="Escribí el nombre del título." required>

                <label for="pais">&#9679; País:</label>
                <select id="pais" name="paisId" required disabled>
                    <option value="" selected>Buscando países...</option>
                </select>

                <p id="mensaje" role="status" aria-live="polite"></p>
                <button id="enviar" type="submit" disabled>Registrar estudiante</button>
            </form>
            <hr>
            <footer>
                <p><a href="/paises/" title="Administración de países">Administración de países</a></p>
            </footer>
        </div>
        <script src="script/script.js"></script>
    </body>
</html>
